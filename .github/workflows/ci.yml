name: CI & Extension Repository Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Package Extensions
        env:
          RELEASE_TAG: v${{ github.run_number }}
        run: ./gradlew packageExtensions

      - name: Check for releasable changes
        id: gate
        run: |
          HAS_RELEASE=$(cat repo/has_release.txt 2>/dev/null || echo "false")
          echo "release=$HAS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release required: $HAS_RELEASE"

      - name: Determine changed files
        if: steps.gate.outputs.release == 'true'
        id: changed
        run: |
          FILE_LIST=$(cat repo/changed_files.txt | tr '\n' ' ')
          echo "list=$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "Changed files to deploy:"
          cat repo/changed_files.txt

      - name: Deploy Versioned Extension Release
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Bunori Extensions v${{ github.run_number }}"
          body: |
            Automated extension release v${{ github.run_number }}.
            Rollback: To rollback to any previous release, set that release as 'latest' in GitHub Releases.
          make_latest: true
          draft: false
          prerelease: false
          files: ${{ steps.changed.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

