name: CI & Extension Repository Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Package Extensions
        env:
          RELEASE_TAG: v${{ github.run_number }}
        run: ./gradlew packageExtensions

      - name: Upload full repo directory as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-output-v${{ github.run_number }}
          path: repo/
          retention-days: 30

      - name: Check for releasable changes
        id: gate
        run: |
          HAS_RELEASE=$(cat repo/has_release.txt 2>/dev/null || echo "false")
          echo "release=$HAS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release required: $HAS_RELEASE"

      - name: Deploy to GitHub Pages (repo branch)
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.gate.outputs.release == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
          keep_files: true
          commit_message: "deploy: Bunori extensions repository update [skip ci]"